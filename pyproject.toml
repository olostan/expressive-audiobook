[project]
name = "expressive-audiobook"
version = "0.1.0"
description = "Turn a book you own (PDF, Markdown or text) into a multi-chapter expressive audiobook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Valentyn Shybanov" }]
dependencies = [
  "pymupdf>=1.24",
  "pyyaml>=6",
  "pillow>=10",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "google-genai>=2.25",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3"]
# Background music and sound effects: mixing, and downloading local model weights.
sound = ["numpy>=1.26", "huggingface_hub>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
audiobook = "expressive_audiobook.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expressive_audiobook = ["prompts/*.md", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "live: calls the Gemini API; skipped unless GEMINI_API_KEY is set",
]
