[project]
name = "pdf-expressive-audiobook"
version = "0.1.0"
description = "Turn a PDF you own into a multi-chapter expressive audiobook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "olostan" }]
dependencies = [
  "pymupdf>=1.24",
  "pyyaml>=6",
  "pillow>=10",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
audiobook = "pdf_expressive_audiobook.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_expressive_audiobook = ["prompts/*.md", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
